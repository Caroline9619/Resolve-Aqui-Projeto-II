<body>


<div class="container">


    <!-- MENU LATERAL -->
    

    <aside class="sidebar">

        <img
            src="../img/logo.png"
            alt="Logo Resolve Aqui"
            class="logo"
        >

        <nav>

    <a href="inicio.html">
        <i class="fa-solid fa-house"></i>
        <span>Início</span>
    </a>

    <a href="perfil.html">
        <i class="fa-solid fa-user"></i>
        <span>Meu Perfil</span>
    </a>

    <a href="login.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sair</span>
    </a>

</nav>

    </aside>


       <main class="conteudo">

        <div class="formulario-container">

            <h1>Cadastro do Cidadão</h1>

            <p class="subtitulo">
                Crie sua conta para acessar o Resolve Aqui
            </p>


            <form id="cadastroForm">

                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>


                <!-- E-MAIL -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        maxlength="14"
                        placeholder="000.000.000-00"
                        required
                    >

                </div>


                <!-- CELULAR -->

                <div class="campo">

                    <label for="celular">
                        Celular (SMS/WhatsApp)
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        maxlength="15"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite novamente sua senha"
                        required
                    >

                </div>


                <!-- TERMOS -->

                <div class="termos">

                    <input
                        type="checkbox"
                        id="aceite"
                        name="aceite"
                        required
                    >

                    <label for="aceite">
                        Li e concordo com os termos e condições
                    </label>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-cadastro"
                >
                    Criar sua conta
                </button>

            </form>

        </div>

    </main>

</div>


<!-- JAVASCRIPT -->

<script src="../js/cadastro.js"></script>

</body>
