<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Resolve Aqui - Cadastro do Cidadão</title>

<!-- CSS -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/cadastro.css">

<!-- Font Awesome -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <!-- MENU LATERAL --> 

    <aside class="sidebar">

        <img
            src="../img/logo.png"
            alt="Logo Resolve Aqui"
            class="logo"
        >

        <nav>

       
    <a href="login.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sair</span>
    </a>

</nav>
    </aside>

       <main class="conteudo">

        <div class="formulario-container">

            <h1>Cadastro do Usuário </h1>

            <p class="subtitulo">
                Escolha o tipo de conta e preencha as informações para acessar o Resolve Aqui.
            </p>
<!-- TIPO DE CONTA -->

<div class="campo">

    <label>Tipo de Conta</label>

    <div class="tipo-conta">

        <label class="opcao-perfil">

            <input
                type="radio"
                name="perfil"
                value="cidadao"
                checked
            >

            <i class="fa-solid fa-circle-user"></i>

            <span>Cidadão</span>

        </label>


        <label class="opcao-perfil">

            <input
                type="radio"
                name="perfil"
                value="servidor"
            >

            <i class="fa-solid fa-user-tie"></i>

            <span>Servidor</span>

        </label>


        <label class="opcao-perfil">

            <input
                type="radio"
                name="perfil"
                value="gestao"
            >

            <i class="fa-solid fa-building"></i>

            <span>Gestão Municipal</span>

        </label>

    </div>

</div>
            <form id="cadastroForm">

                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>

                <!-- E-MAIL -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <!-- CPF -->

                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        maxlength="14"
                        placeholder="000.000.000-00"
                        required
                    >

                </div>

                <!-- CELULAR -->

                <div class="campo">

                    <label for="celular">
                        Celular (SMS/WhatsApp)
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        maxlength="15"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>
<!-- CAMPOS EXCLUSIVOS -->

<div id="camposFuncionario" class="campos-funcionario oculto">

    <div class="campo">

        <label for="matricula">
            Matrícula Funcional
        </label>

        <input
            type="text"
            id="matricula"
            placeholder="Informe sua matrícula"
        >

    </div>


    <div class="campo">

        <label for="secretaria">
            Secretaria
        </label>

        <select id="secretaria">

            <option value="">
                Selecione
            </option>

            <option>Secretaria de Obras</option>
            <option>Secretaria de Saúde</option>
            <option>Secretaria de Educação</option>
            <option>Secretaria de Meio Ambiente</option>
            <option>Secretaria de Assistência Social</option>
            <option>Secretaria de Administração</option>

        </select>

    </div>


    <div class="campo" id="cargoGestao" style="display:none;">

        <label for="cargo">
            Cargo de Gestão
        </label>

        <select id="cargo">

            <option value="">
                Selecione
            </option>

            <option>Secretário Municipal</option>
            <option>Secretário Adjunto</option>
            <option>Prefeito</option>
            <option>Vice-Prefeito</option>
            <option>Coordenador</option>

        </select>

    </div>

</div>
                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite novamente sua senha"
                        required
                    >

                </div>

                <!-- TERMOS -->

                <div class="termos">

                    <input
                        type="checkbox"
                        id="aceite"
                        name="aceite"
                        required
                    >

                    <label for="aceite">
                        Li e concordo com os termos e condições
                    </label>

                </div>

                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-cadastro"
                >
                    Criar sua conta
                </button>

            </form>

        </div>

    </main>

</div>


<!-- JAVASCRIPT -->

<script src="../js/cadastro.js"></script>


</body>

</html>
